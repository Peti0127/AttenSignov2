<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signatur-Einstellungen</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="preferences.js"></script>
  <script defer src="settings.js"></script>
  <style>
    :root { --red:#cb2525; --ink:#222220; --muted:#6f6d68; --line:#deddd7; --paper:#f7f6f1; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Arial,sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:18px; background:#fff; border-bottom:1px solid var(--line); }
    .logo { display:grid; place-items:center; width:36px; height:36px; color:#fff; background:var(--red); font-size:20px; font-weight:800; }
    .eyebrow { margin:0 0 2px; color:var(--red); font-size:9px; font-weight:800; letter-spacing:.16em; }
    h1 { margin:0; font-size:18px; }
    .back-link { margin-left:auto; color:var(--ink); font-size:12px; font-weight:700; text-decoration:none; }
    .back-link:hover, .back-link:focus-visible { color:var(--red); outline:none; }
    main { padding:26px 18px; }
    .step { display:block; margin-bottom:6px; color:var(--red); font-size:9px; font-weight:800; letter-spacing:.15em; }
    h2 { margin:0 0 22px; font-size:19px; }
    .field + .field { margin-top:22px; }
    label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; }
    select { width:100%; height:42px; padding:0 11px; border:1px solid #cbc9c2; border-radius:4px; background:#fff; color:var(--ink); font:inherit; }
    select:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(203,37,37,.1); outline:none; }
    .hint { margin:10px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
    #settings-status { margin:18px 0 0; color:var(--muted); font-size:11px; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">A</div>
    <div><p class="eyebrow">ATTENSAM</p><h1>Einstellungen</h1></div>
    <a class="back-link" href="taskpane.html">← Zurück</a>
  </header>

  <main>
    <span class="step">SIGNATUR</span>
    <h2>Darstellung</h2>
    <div class="field">
      <label for="phone-mode">Nummer anzeigen</label>
      <select id="phone-mode" disabled>
        <option value="Alles">Handy und Festnetz</option>
        <option value="Handy">Nur Handy</option>
        <option value="Festnetz">Nur Festnetz</option>
        <option value="Office">Office Nummer</option>
      </select>
    </div>
    <div class="field">
      <label for="greeting-mode">Grußformel</label>
      <select id="greeting-mode" disabled>
        <option value="MfG1">Mit freundlichen Grüßen</option>
        <option value="MfG2">Freundliche Grüße</option>
        <option value="MfG3">LG</option>
      </select>
    </div>
    <p class="hint">Die Auswahl wird für Ihr Microsoft-365-Benutzerkonto gespeichert.</p>
    <p id="settings-status" role="status" aria-live="polite">Einstellungen werden geladen …</p>
  </main>
</body>
</html>
