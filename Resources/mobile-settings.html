<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Signatur-Einstellungen</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.18.0/lib/msal-browser.min.js"></script>
  <script defer src="preferences.js?v=1.6.0"></script>
  <script defer src="mobile-settings.js?v=1.6.0"></script>
  <style>
    :root { --red:#cb2525; --ink:#222220; --muted:#6f6d68; --line:#deddd7; --paper:#f7f6f1; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:Arial,sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:16px 18px; background:#fff; border-bottom:1px solid var(--line); }
    .logo { display:grid; place-items:center; width:38px; height:38px; color:#fff; background:var(--red); font-size:21px; font-weight:800; }
    .eyebrow { margin:0 0 2px; color:var(--red); font-size:9px; font-weight:800; letter-spacing:.16em; }
    h1 { margin:0; font-size:18px; }
    main { max-width:560px; margin:0 auto; padding:26px 18px 110px; }
    .step { display:block; margin-bottom:6px; color:var(--red); font-size:9px; font-weight:800; letter-spacing:.15em; }
    h2 { margin:0 0 22px; font-size:20px; }
    .field + .field { margin-top:22px; }
    label { display:block; margin-bottom:8px; font-size:14px; font-weight:700; }
    select, input[type="text"] { width:100%; min-height:46px; padding:0 12px; border:1px solid #cbc9c2; border-radius:5px; background:#fff; color:var(--ink); font:inherit; }
    select:focus, input[type="text"]:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(203,37,37,.1); outline:none; }
    .checkbox-row { display:flex; align-items:center; gap:11px; margin:0; cursor:pointer; }
    .checkbox-row input { width:20px; height:20px; margin:0; accent-color:var(--red); }
    .checkbox-row span { font-size:14px; font-weight:700; }
    [hidden] { display:none !important; }
    .hint { margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
    footer { position:fixed; inset:auto 0 0; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(255,255,255,.97); }
    .footer-inner { display:flex; align-items:center; gap:12px; max-width:560px; margin:0 auto; }
    #settings-status { flex:1; margin:0; color:var(--muted); font-size:11px; line-height:1.4; }
    #close-button { min-height:40px; padding:0 16px; border:1px solid var(--red); border-radius:4px; color:#fff; background:var(--red); font:inherit; font-size:13px; font-weight:700; }
    #close-button:focus-visible { box-shadow:0 0 0 3px rgba(203,37,37,.2); outline:none; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">A</div>
    <div><p class="eyebrow">ATTENSAM</p><h1>Einstellungen</h1></div>
  </header>

  <main>
    <span class="step">MOBILE SIGNATUR</span>
    <h2>Darstellung</h2>
    <div class="field">
      <label for="phone-mode">Nummer anzeigen</label>
      <select id="phone-mode" disabled>
        <option value="Alles">Handy und Festnetz</option>
        <option value="Handy">Nur Handy</option>
        <option value="Festnetz">Nur Festnetz</option>
        <option value="Office">Office Nummer</option>
        <option id="edv-hotline-option" value="EDVHotline" hidden disabled>EDV Hotline</option>
      </select>
    </div>
    <div class="field">
      <label for="greeting-mode">Grußformel</label>
      <select id="greeting-mode" disabled>
        <option value="MfG0">Keine Grußformel</option>
        <option value="MfG1">Mit freundlichen Grüßen</option>
        <option value="MfG2">Freundliche Grüße</option>
        <option value="MfG3">LG</option>
        <option value="MfGCustom">Benutzerdefiniert</option>
      </select>
    </div>
    <div id="custom-greeting-field" class="field" hidden>
      <label for="custom-greeting">Eigene Grußformel</label>
      <input id="custom-greeting" type="text" maxlength="200" autocomplete="off" placeholder="z. B. Schöne Grüße" disabled>
    </div>
    <div id="title-before-field" class="field" hidden>
      <label class="checkbox-row" for="insert-title-before">
        <input id="insert-title-before" type="checkbox" disabled>
        <span>Titel vorg. einfügen</span>
      </label>
    </div>
    <div id="title-after-field" class="field" hidden>
      <label class="checkbox-row" for="insert-title-after">
        <input id="insert-title-after" type="checkbox" disabled>
        <span>Titel nachg. einfügen</span>
      </label>
    </div>
    <div class="field">
      <label class="checkbox-row" for="mobile-usage">
        <input id="mobile-usage" type="checkbox" disabled>
        <span>Mobile Nutzung</span>
      </label>
    </div>
    <div class="field">
      <label class="checkbox-row" for="confidentiality">
        <input id="confidentiality" type="checkbox" disabled>
        <span>Vertraulichkeit</span>
      </label>
    </div>
    <div class="field">
      <label class="checkbox-row" for="auto-insert">
        <input id="auto-insert" type="checkbox" disabled>
        <span>Signatur automatisch einfügen</span>
      </label>
    </div>
    <div id="auto-insert-mode-field" class="field" hidden>
      <label for="auto-insert-mode">Automatisch einfügen</label>
      <select id="auto-insert-mode" disabled>
        <option value="NewMail">Einfügen bei neuen Emails</option>
        <option value="AllMail">Einfügen bei allen Emails</option>
      </select>
    </div>
    <p class="hint">Die Auswahl und Ihr Microsoft-365-Profil werden für die automatische Signatur gespeichert.</p>
  </main>

  <footer>
    <div class="footer-inner">
      <p id="settings-status" role="status" aria-live="polite">Outlook wird initialisiert …</p>
      <button id="close-button" type="button">Fertig</button>
    </div>
  </footer>
</body>
</html>
