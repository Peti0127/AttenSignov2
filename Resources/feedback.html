<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Attensam Feedback</title>
  <link rel="icon" type="image/png" href="Images/Icons/Icon-32.png">
  <script>
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.dataset.clientTheme = "dark";
    }
  </script>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme:light; --red:#e10000; --ink:#090909; --muted:#666; --line:#d2d2d2; --paper:#f7f7f7; --surface:#fff; --control-bg:#fff; --control-ink:#090909; --control-border:#aaa; --hover:#f1f1f1; }
    :root[data-client-theme="dark"] { color-scheme:dark; --ink:#f2f2f2; --muted:#b8b8b8; --line:#4a4a4a; --paper:#111; --surface:#222; --control-bg:#2b2b2b; --control-ink:#f5f5f5; --control-border:#656565; --hover:#333; }
    @media (prefers-color-scheme:dark) {
      :root:not([data-client-theme="light"]) { color-scheme:dark; --ink:#f2f2f2; --muted:#b8b8b8; --line:#4a4a4a; --paper:#111; --surface:#222; --control-bg:#2b2b2b; --control-ink:#f5f5f5; --control-border:#656565; --hover:#333; }
    }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:Inter,"Segoe UI",Arial,sans-serif; }
    header { display:flex; align-items:center; gap:12px; min-height:72px; padding:15px 18px; background:var(--surface); border-bottom:3px solid var(--red); }
    .logo-frame { display:grid; place-items:center; width:38px; height:34px; flex:0 0 auto; padding-right:12px; border-right:1px solid var(--line); }
    .logo { display:block; width:24px; height:24px; object-fit:contain; }
    .eyebrow { margin:0 0 2px; color:var(--red); font-size:9px; font-weight:800; letter-spacing:.16em; }
    h1 { margin:0; color:var(--ink); font-size:18px; font-weight:600; }
    main { max-width:640px; margin:0 auto; padding:24px 18px 36px; }
    .intro { margin:0 0 22px; color:var(--muted); font-size:12px; line-height:1.5; }
    .field + .field { margin-top:22px; }
    label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; }
    select, textarea { width:100%; padding:10px 11px; border:1px solid var(--control-border); border-radius:0; background:var(--control-bg); color:var(--control-ink); font:inherit; }
    select { min-height:42px; }
    textarea { min-height:190px; resize:vertical; line-height:1.45; }
    select:focus, textarea:focus { border-color:var(--red); box-shadow:0 0 0 2px rgba(225,0,0,.12); outline:none; }
    .actions { display:flex; gap:10px; margin-top:22px; }
    button { min-height:42px; padding:0 18px; border:0; border-radius:0; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .send { color:#fff; background:var(--red); }
    .cancel { border:1px solid var(--control-border); color:var(--control-ink); background:var(--control-bg); }
    button:hover:not(:disabled), button:focus-visible { box-shadow:0 0 0 2px rgba(225,0,0,.18); outline:none; }
    .status { min-height:18px; margin:16px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .status.error { color:#c00000; }
  </style>
</head>
<body>
  <header>
    <div class="logo-frame" aria-hidden="true"><img class="logo" src="Images/Icons/Icon-32.png" alt=""></div>
    <div><p class="eyebrow">ATTENSAM</p><h1>Feedback</h1></div>
  </header>
  <main>
    <p class="intro">Fehler, Wünsche, Feedback oder Fragen zum Add-In direkt an die zuständige Stelle senden.</p>
    <form id="feedback-form">
      <div class="field">
        <label for="feedback-category">Kategorie</label>
        <select id="feedback-category" required>
          <option value="Fehler">Fehler</option>
          <option value="Wünsche">Wünsche</option>
          <option value="Feedback">Feedback</option>
          <option value="Hilfe">Hilfe</option>
        </select>
      </div>
      <div class="field">
        <label for="feedback-message">Nachricht</label>
        <textarea id="feedback-message" maxlength="5000" required placeholder="Beschreiben Sie Ihr Anliegen …"></textarea>
      </div>
      <div class="actions">
        <button id="send-button" class="send" type="submit">E-Mail senden</button>
        <button id="cancel-button" class="cancel" type="button">Schließen</button>
      </div>
      <p id="feedback-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("feedback-form");
    const category = document.getElementById("feedback-category");
    const message = document.getElementById("feedback-message");
    const sendButton = document.getElementById("send-button");
    const cancelButton = document.getElementById("cancel-button");
    const status = document.getElementById("feedback-status");

    function setStatus(text, error = false) {
      status.textContent = text;
      status.classList.toggle("error", error);
    }

    function messageParent(payload) {
      const value = JSON.stringify(payload);
      try {
        Office.context.ui.messageParent(value, { targetOrigin: window.location.origin });
      } catch {
        Office.context.ui.messageParent(value);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) {
        setStatus("Bitte geben Sie eine Nachricht ein.", true);
        message.focus();
        return;
      }
      sendButton.disabled = true;
      category.disabled = true;
      message.disabled = true;
      setStatus("E-Mail wird gesendet …");
      messageParent({ type: "feedback-submit", category: category.value, message: text });
    });

    cancelButton.addEventListener("click", () => messageParent({ type: "feedback-close" }));

    Office.onReady(() => {
      if (Office.context?.ui?.addHandlerAsync && Office.EventType?.DialogParentMessageReceived) {
        Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, (event) => {
          let payload;
          try {
            payload = JSON.parse(String(event.message || ""));
          } catch {
            payload = null;
          }
          if (payload?.type !== "feedback-result") return;
          if (payload.success) {
            setStatus("Feedback wurde erfolgreich gesendet.");
            return;
          }
          sendButton.disabled = false;
          category.disabled = false;
          message.disabled = false;
          setStatus(payload.message || "Feedback konnte nicht gesendet werden.", true);
        });
      }

      const theme = Office.context?.officeTheme;
      const background = String(theme?.bodyBackgroundColor || "");
      if (/^#[0-9a-f]{6}$/i.test(background)) {
        const red = Number.parseInt(background.slice(1, 3), 16);
        const green = Number.parseInt(background.slice(3, 5), 16);
        const blue = Number.parseInt(background.slice(5, 7), 16);
        document.documentElement.dataset.clientTheme = (red * 299 + green * 587 + blue * 114) / 1000 < 145 ? "dark" : "light";
      }
    });
  </script>
</body>
</html>
